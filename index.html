<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Signup Form" />
    <meta name="keywords" content="Signup, Form, HTML, CSS" />
    <meta name="author" content="John Doe" />
    <link rel="stylesheet" href="style.css" />
    <title>Signup Form</title>
  </head>
  <body>
    <main>
      <div class="left">
        <div class="background">
          <div class="logo">
            <img
              src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
              alt="logo"
            />
            <h1 class="logo-head">Odin Project</h1>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="hero-text">
          <h1>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <i>now</i> to get started.
          </h1>
          <h2>You <i>know</i> you want to.</h2>
        </div>
        <form action="#" class="signup-form">
          <h3 class="form-title">Let's do this!</h3>
          <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" required />
          </div>
          <div class="form-group">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              invalid
            />
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              required
              invalid
            />
          </div>
        </form>
        <button type="submit" class="signup-button">Create Account</button>
        <p class="login-link">
          Already have an account? <a href="#">Log in</a>
        </p>
      </div>
    </main>
  </body>
</html>
